<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SpatialHash OG Image Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,800;1,800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; }
        .canvas-container {
            width: 1200px;
            height: 630px;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            padding: 80px;
            box-sizing: border-box;
            border: 4px solid #1f1f1f;
        }
        
        .grid-bg {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle at 80% 50%, rgba(255, 215, 0, 0.15) 0%, transparent 50%),
                              linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 60px 60px, 60px 60px;
            opacity: 0.8;
        }

        .content {
            position: relative;
            z-index: 10;
            max-width: 700px;
        }

        .label {
            font-family: 'JetBrains Mono', monospace;
            color: #FFD700;
            font-size: 18px;
            letter-spacing: 0.4em;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #fff;
            font-size: 84px;
            font-weight: 800;
            font-style: italic;
            line-height: 0.9;
            margin: 0;
            letter-spacing: -0.05em;
        }

        h1 span {
            color: #FFD700;
        }

        .subtitle {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #a3a3a3;
            font-size: 28px;
            margin-top: 30px;
            line-height: 1.4;
            font-weight: 400;
        }

        .visualizer {
            position: absolute;
            right: 80px;
            top: 50%;
            transform: translateY(-50%);
            width: 400px;
            height: 400px;
            border: 2px solid #FFD700;
            border-radius: 40px;
            background: rgba(255, 215, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .node-web {
            position: absolute;
            inset: 0;
        }

        .badge {
            position: absolute;
            bottom: 80px;
            right: 80px;
            background: #fff;
            color: #000;
            padding: 8px 20px;
            border-radius: 12px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>

    <div class="canvas-container">
        <div class="grid-bg"></div>
        
        <div class="content">
            <div class="label">Unity Optimization</div>
            <h1>Spatial<br><span>Hashing</span><br>Masterclass.</h1>
            <p class="subtitle">Architecting O(1) performance for high-speed games. From O(N²) chaos to million-particle optimization.</p>
        </div>

        <div class="visualizer">
            <canvas id="webCanvas" width="400" height="400"></canvas>
        </div>

        <div class="badge">UNITY 2026 READY</div>
    </div>

    <script>
        const canvas = document.getElementById('webCanvas');
        const ctx = canvas.getContext('2d');
        const dots = Array.from({length: 40}, () => ({
            x: Math.random() * 400,
            y: Math.random() * 400
        }));

        ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
        ctx.lineWidth = 1;
        
        // Draw Grid
        for(let x=0; x<=400; x+=40) {
            ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,400); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0,x); ctx.lineTo(400,x); ctx.stroke();
        }

        // Draw Nodes & Local Web
        dots.forEach((d, i) => {
            ctx.fillStyle = '#FFD700';
            ctx.beginPath(); ctx.arc(d.x, d.y, 3, 0, Math.PI*2); ctx.fill();
            
            // Connect to nearby nodes (simulating hash)
            dots.forEach((d2, j) => {
                if (i === j) return;
                const dist = Math.sqrt((d.x-d2.x)**2 + (d.y-d2.y)**2);
                if (dist < 60) {
                    ctx.strokeStyle = 'rgba(255, 215, 0, 0.4)';
                    ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(d2.x, d2.y); ctx.stroke();
                }
            });
        });
    </script>
</body>
</html>
